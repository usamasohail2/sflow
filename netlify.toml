# Netlify configuration file
# This ensures HTTPS is enforced and handles redirects

[build]
  # No build command needed - static site
  publish = "."

# Redirect HTTP to HTTPS
[[redirects]]
  from = "http://signatureflow.xyz/*"
  to = "https://signatureflow.xyz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.signatureflow.xyz/*"
  to = "https://www.signatureflow.xyz/:splat"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
